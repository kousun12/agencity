model = "gpt-5.6-sol"
num_tasks = 50
num_rollouts = 1
shuffle = false
max_concurrent = 1
push = false
rich = false

[client]
type = "eval"
base_url = "https://api.openai.com/v1"
api_key_var = "OPENAI_API_KEY"

[sampling]
reasoning_effort = "xhigh"
max_tokens = 128000

[env.taskset]
id = "agencity-oolong-synth"
split = "test"
dataset_name = "yahoo"
context_len = 131072
with_labels = false
filter_numerical = false
expected_tasks = 50
dataset_revision = "f0d59eaf0febf130664cfceb710436c8e3216b2b"
selection_manifest = "yahoo-test-128k-v1"
selection_manifest_sha256 = "d0a105f1ee619adf94cdaf8cc5e9606cb82a57bd7f970d476a3a2db3b9a5c275"

[env.taskset.selection]
mode = "all"

[env.agent]
max_turns = 64
max_input_tokens = 800000
max_output_tokens = 500000
max_total_tokens = 1000000

[env.agent.timeout]
setup = 300
rollout = 3600
finalize = 60
scoring = 60

[env.agent.retries]
max_retries = 0

[env.agent.harness]
id = "agencity-verifiers"
source_repo = "https://github.com/kousun12/agencity.git"
source_ref = "290e01d4508487bc3f8dd7de2f38b7bda08c31ee"
installation = "portable"
bun_url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
bun_sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"

[env.agent.runtime]
type = "docker"
image = "oven/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4"
allow = []
block = ["*"]
cpu = 2
memory = 4
disk = 4
