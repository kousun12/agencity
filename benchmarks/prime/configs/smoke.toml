model = "gpt-5.6-luna"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false
rich = false

[client]
type = "eval"
base_url = "https://api.openai.com/v1"
api_key_var = "OPENAI_API_KEY"

[sampling]
reasoning_effort = "xhigh"
max_tokens = 128000

[env.taskset]
id = "agencity-verifiers"

[env.agent]
max_turns = 50
max_input_tokens = 800000
max_output_tokens = 500000
max_total_tokens = 1000000

[env.agent.timeout]
setup = 300
rollout = 300
finalize = 60
scoring = 60

[env.agent.retries]
max_retries = 0

[env.agent.harness]
id = "agencity-verifiers"
source_repo = "https://github.com/kousun12/agencity.git"
source_ref = "b96b0acf0403ab29ef53fb1e78213ff211f624ec"

[env.agent.runtime]
type = "docker"
image = "oven/bun:1.3.14"
allow = []
block = ["*"]
cpu = 2
memory = 4
disk = 4
