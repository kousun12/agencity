[project]
name = "agencity-verifiers"
version = "0.1.0"
description = "Prime Verifiers adapter and smoke taskset for Agencity."
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers==0.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agencity_verifiers"]
