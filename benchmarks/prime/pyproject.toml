[project]
name = "agencity-verifiers"
version = "0.1.0"
description = "Prime Verifiers adapter and benchmark tasksets for Agencity."
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=5.0.1",
    "harbor==0.20.0",
    "python-dateutil>=2.9.0.post0",
    "verifiers[harbor]==0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agencity_verifiers",
    "agencity_oolong_synth",
    "agencity_terminal_bench_2",
    "agencity_terminal_bench_2_1",
    "agencity_swe_bench_pro",
]

[tool.hatch.build.targets.wheel.force-include]
"manifests/terminal-bench-2-fix-git.json" = "agencity_terminal_bench_2/data/manifest.json"
"uv.lock" = "agencity_terminal_bench_2/data/uv.lock"
"manifests/terminal-bench-2-1-fix-git.json" = "agencity_terminal_bench_2_1/data/manifest.json"
"manifests/swe-bench-pro-public-vuls.json" = "agencity_swe_bench_pro/data/manifest.json"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.cache",
    "/.venv",
    "/dist",
    "/outputs",
]
