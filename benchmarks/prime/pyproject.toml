[project]
name = "agencity-verifiers"
version = "0.1.0"
description = "Prime Verifiers adapter and benchmark tasksets for Agencity."
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=5.0.1",
    "python-dateutil>=2.9.0.post0",
    "verifiers==0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agencity_verifiers", "agencity_oolong_synth"]
